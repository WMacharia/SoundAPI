<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
<title>Sound API</title>

<style>
    body {
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }

    .card {
        background: #686868;
        padding: 20px;
        border-radius: 12px;
        width: 280px;
        text-align: center;
    }

    img {
        width: 100%;
        border-radius: 10px;
    }

    h2 {
    font-family: 'Playfair Display', serif;
    font-size: 16px;
    margin: 10px 0;
    font-weight: 600;
    }

    .controls {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
        margin-top: 10px;
    }

    .controls button {
        background: none;
        border: none;
        color: white;
        font-size: 16px;
        cursor: pointer;
        opacity: 0.8;
    }

    .controls button:hover {
        opacity: 1;
    }

    #playBtn {
        font-size: 26px;
    }

    input[type="range"] {
        width: 100%;
        margin-top: 10px;
    }

    .time {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        opacity: 0.7;
    }

    .volume-control {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    }

    .volume-control span {
        font-size: 14px;
        opacity: 0.7;
    }

    .volume-control input[type="range"] {
        flex: 1;
        height: 3px;
        appearance: none;
        background: #555;
        border-radius: 2px;
        outline: none;
    }

    .volume-control input[type="range"]::-webkit-slider-thumb {
        appearance: none;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: white;
        cursor: pointer;
    }
</style>
</head>

<body>

<div class="card">
    <h5>- Press Space to Pause / Play <br>
    - Right / Left arrow to skip forward / backward</h5>
    <img src="Mariah-the-Scientist.jpeg" alt="Cover">

    <h2 id="songTitle"></h2>

    <!-- Progress -->
    <input type="range" id="progress" value="0">
    <div class="time">
        <span id="currentTime">0:00</span>
        <span id="totalTime">0:00</span>
    </div>

    <!-- Controls -->
    <div class="controls">
        <button onclick="skipBackward()">↩ 5</button>
        <button onclick="togglePlay()" id="playBtn">▶</button>
        <button onclick="skipForward()">↪ 5</button>
    </div>

    <!-- Volume -->
    <div class="volume-control">
        <span>🔈</span>
        <input type="range" id="volumeSlider" min="0" max="1" step="0.01">
        <span>🔊</span>
    </div>
    <audio id="audio">
        <source src="Mariah the Scientist - 2 You (Audio).mp3" type="audio/mpeg">
    </audio>
</div>

<script>
const audio = document.getElementById("audio");
const playBtn = document.getElementById("playBtn");
const progress = document.getElementById("progress");
const volumeSlider = document.getElementById("volumeSlider");

const currentTimeEl = document.getElementById("currentTime");
const totalTimeEl = document.getElementById("totalTime");
const songTitle = document.getElementById("songTitle");

// Play/Pause
function togglePlay() {
    if (audio.paused) {
        audio.play();
        playBtn.textContent = "⏸";
    } else {
        audio.pause();
        playBtn.textContent = "▶";
    }
}

// Skip 5 sec
function skipForward() {
    audio.currentTime += 5;
}

function skipBackward() {
    audio.currentTime -= 5;
}

// Volume
audio.volume = 0.5;
volumeSlider.value = 0.5;

volumeSlider.addEventListener("input", () => {
    audio.volume = volumeSlider.value;
});

// Progress bar
audio.addEventListener("timeupdate", () => {
    progress.value = (audio.currentTime / audio.duration) * 100 || 0;
    currentTimeEl.textContent = formatTime(audio.currentTime);
});

// Duration
audio.addEventListener("loadedmetadata", () => {
    totalTimeEl.textContent = formatTime(audio.duration);
});

// Seek
progress.addEventListener("input", () => {
    audio.currentTime = (progress.value / 100) * audio.duration;
});

// Keyboard controls
document.addEventListener("keydown", (e) => {
    if (e.code === "Space") togglePlay();
    if (e.code === "ArrowRight") skipForward();
    if (e.code === "ArrowLeft") skipBackward();
});

function formatTime(seconds) {
    const mins = Math.floor(seconds / 60) || 0;
    const secs = Math.floor(seconds % 60) || 0;
    return mins + ":" + (secs < 10 ? "0" : "") + secs;
}

function updateSongTitle() {
    const src = audio.querySelector("source").src;

    let fileName = src.split("/").pop();
    fileName = decodeURIComponent(fileName);
    fileName = fileName.replace(".mp3", "");

    songTitle.textContent = fileName;
}

updateSongTitle();
</script>

</body>
</html>
